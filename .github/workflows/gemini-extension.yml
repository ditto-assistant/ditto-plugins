name: Gemini extension branch
# Gemini CLI installs a GitHub repository only from its root, so plugins/ditto is
# published unchanged as the root of the gemini-extension branch:
#   gemini extensions install https://github.com/ditto-assistant/ditto-plugins --ref gemini-extension
# Fast-forward only; nothing is force-pushed, released or submitted.
on:
  push:
    branches: [main]
    paths:
      - 'plugins/ditto/**'
      - 'scripts/publish_extension_ref.py'
      - '.github/workflows/gemini-extension.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gemini-extension-branch
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify the package before publishing it
        run: |
          python3 scripts/shared_skills.py verify --host plugins --repo .
          python3 -m unittest discover -s tests
          python3 scripts/validate_package.py
      - name: Publish plugins/ditto to the gemini-extension branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: python3 scripts/publish_extension_ref.py --source "$GITHUB_SHA" --branch gemini-extension
