name: Shared skills
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify generated content and provenance
        run: python3 scripts/shared_skills.py verify --host plugins --repo .
      - name: Verify MCP-only package boundary
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/validate_package.py
